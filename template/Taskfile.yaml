---
# Tasks for the Task runner:
#
# https://taskfile.dev/

version: "3.50"

set: [pipefail]

includes:
  copier:
    taskfile: .tasks/prelude/copier
  plumbing:
    taskfile: .tasks/prelude/plumbing
    flatten: true
  managed:
    taskfile: .tasks/plumbing/managed
    flatten: true
    optional: true

tasks:
  default:
    cmds:
      - task: "list"

  list:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE}} --list"
