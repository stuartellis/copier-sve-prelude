---
# Tasks for the Task runner:
#
# https://taskfile.dev/

version: "3.50"

set: [pipefail]

includes:
  copier:
    taskfile: tasks/prelude/copier
  plumbing:
    taskfile: tasks/prelude/plumbing
    flatten: true
    vars:
      TASK_INCLUSIONS_INDEX_DIR: "./tasks/.plumbing/managed"
      TASK_INCLUSIONS_ROOT_DIR: "./tasks/managed"
  managed:
    taskfile: tasks/.plumbing/managed
    flatten: true
    optional: true

tasks:
  default:
    cmds:
      - task: "list"

  list:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE}} --list"
