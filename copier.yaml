---
# Configuration for Copier Template
#
# See:
#
# https://copier.readthedocs.io/en/stable/

# This template uses the configuration format introduced in Copier version 9.
_min_copier_version: "9"

# Use this subdirectory of the template repository as the root directory of the template.
_subdirectory: template

# Name of the answers file.
# This must be unique to avoid conflicts with other Copier templates.
_answers_file: .copier-answers-sve-prelude.yaml

# Use alternate template delimiters
# This avoids conflicts with templating that is defined in the managed files
_envops:
  block_end_string: "%]"
  block_start_string: "[%"
  comment_end_string: "#]"
  comment_start_string: "[#"
  variable_end_string: "]]"
  variable_start_string: "[["

# Create these files if they do not exist
_skip_if_exists:
  - .gitignore
  - LICENSE.md
  - Taskfile.yaml
  - README.md

# Prompts

project_name:
  type: str
  help: Your project name

project_description:
  type: str
  help: Your project description

maintainer_fullname:
  type: str
  help: Your full name

maintainer_email:
  type: str
  help: Your email

maintainer_username:
  type: str
  help: Your username on the repository provider

repository_provider:
  type: str
  help: Your repository provider
  default: gitlab.com
  choices:
    - codeberg.org
    - github.com
    - gitlab.com

repository_namespace:
  type: str
  help: Your repository namespace
  default: "[[ maintainer_username ]]"

repository_name:
  type: str
  help: Your repository name
  default: "[[ project_name ]]"

copyright_holder:
  type: str
  help: The name of the person or entity that holds the copyright
  default: "[[ maintainer_fullname ]]"

copyright_holder_email:
  type: str
  help: The email of the person or entity that holds the copyright
  default: "[[ maintainer_email ]]"

copyright_date:
  type: str
  help: The copyright date
  default: "2026"
